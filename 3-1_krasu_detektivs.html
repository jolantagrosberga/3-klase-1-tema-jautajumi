<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krāsu detektīvs</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --bg:#FBF9F6;--surface:#fff;--line:#E3DCD4;
    --text:#1F3348;--muted:#6D7B88;--blue:#2E74B5;--terra:#C75000;
    --ok:#2D8A3E;--no:#C0392B;
  }
  html,body{height:100%;overflow:hidden;background:var(--bg);}
  body{font-family:'Candara','Aptos','Segoe UI',sans-serif;color:var(--text);}

  #frame{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;}
  #stage{
    width:1600px;height:900px;flex:0 0 auto;transform-origin:center center;
    padding:26px 40px 22px;display:flex;flex-direction:column;
  }

  header{text-align:center;margin-bottom:14px;}
  h1{font-size:38px;letter-spacing:-0.5px;}
  header p{color:var(--muted);font-size:19px;margin-top:3px;}

  .main{display:flex;gap:24px;flex:1;min-height:0;}

  .side{width:340px;flex-shrink:0;display:flex;flex-direction:column;gap:14px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px 20px;}
  .label{font-size:13px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
  .big{font-size:34px;line-height:1.1;}
  .bar{height:14px;border-radius:8px;background:#EFEAE4;overflow:hidden;margin-top:12px;}
  .bar span{display:block;height:100%;background:var(--blue);width:0;transition:width .3s;}
  .dots{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;}
  .dot{width:22px;height:22px;border-radius:50%;background:#EFEAE4;border:2px solid transparent;}
  .dot.ok{background:var(--ok);}
  .dot.no{background:var(--no);}
  .dot.now{border-color:var(--terra);}

  .qcard{
    flex:1;background:var(--surface);border:1px solid var(--line);border-radius:24px;
    padding:26px 30px;display:flex;flex-direction:column;min-width:0;
  }
  .qnum{font-size:15px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
  .q{font-size:27px;line-height:1.3;margin-bottom:6px;}
  .qhint{font-size:18px;color:var(--muted);min-height:24px;margin-bottom:16px;}

  .qimg{
    width:100%;height:250px;object-fit:cover;border-radius:18px;margin-top:20px;
    border:1px solid var(--line);background:#F0EBE4;display:block;
  }
  .credit{font-size:13px;color:var(--muted);text-align:right;margin-top:10px;}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .opt{
    font-family:inherit;text-align:left;font-size:21px;line-height:1.35;
    padding:16px 18px;border-radius:18px;border:2px solid var(--line);background:#fff;
    color:var(--text);cursor:pointer;display:flex;align-items:center;gap:14px;transition:all .15s;
  }
  .opt:hover:not(:disabled){border-color:var(--blue);background:#F7FAFD;}
  .opt:focus-visible{outline:4px solid var(--terra);outline-offset:3px;}
  .opt .sw{width:52px;height:52px;border-radius:12px;border:2px solid rgba(0,0,0,0.10);flex-shrink:0;}
  .opt.ok{border-color:var(--ok);background:#EDF7EF;}
  .opt.no{border-color:var(--no);background:#FBEDEB;}
  .opt:disabled{cursor:default;}

  .fb{
    margin-top:22px;border-radius:18px;padding:16px 18px;font-size:19px;line-height:1.45;
    background:#F7F3EE;display:none;
  }
  .fb.on{display:block;}
  .fb b{font-weight:400;}
  .fb.ok b{color:var(--ok);}
  .fb.no b{color:var(--no);}

  .btnrow{display:flex;justify-content:flex-end;gap:12px;margin-top:auto;padding-top:16px;}
  .btnrow>.btn{flex:0 0 auto;width:auto;}
  .btn{
    font-family:inherit;font-size:20px;padding:12px 26px;border-radius:14px;
    border:1px solid var(--line);background:#fff;color:var(--text);cursor:pointer;
  }
  .btn.main{background:var(--blue);border-color:var(--blue);color:#fff;}
  .btn:hover{filter:brightness(0.97);}
  .btn:focus-visible{outline:4px solid var(--terra);outline-offset:3px;}
  .btn[hidden]{display:none;}

  .final{display:none;flex-direction:column;align-items:center;justify-content:center;flex:1;text-align:center;gap:14px;}
  .final.on{display:flex;}
  .final .score{font-size:64px;}
  .final .btn{flex:0 0 auto;}
  .final .msg{font-size:24px;color:var(--muted);max-width:640px;line-height:1.45;}
</style>
</head>
<body>

<div id="frame"><div id="stage">

  <header>
    <h1>Krāsu detektīvs</h1>
    <p>Āķīgi jautājumi par krāsu jaukšanu, nokrāsām un krāsu nozīmi</p>
  </header>

  <div class="main">

    <div class="side">
      <div class="card">
        <div class="label">Pareizās atbildes</div>
        <div class="big"><span id="score">0</span> no <span id="total">0</span></div>
        <div class="bar"><span id="bar"></span></div>
        <div class="dots" id="dots"></div>
      </div>
      <div class="card" style="flex:1;">
        <div class="label">Detektīva padoms</div>
        <p style="font-size:18px;line-height:1.5;color:var(--muted);" id="advice">
          Nesteidzies. Vispirms izlasi visas atbildes — dažā jautājumā divas atbildes izskatās gandrīz vienādas.
        </p>
      </div>
    </div>

    <div class="qcard">
      <div id="quiz">
        <div class="qnum" id="qnum"></div>
        <div class="q" id="q"></div>
        <div class="qhint" id="qhint"></div>
        <div class="opts" id="opts"></div>
        <img class="qimg" id="qimg" alt="">
      </div>

      <div class="fb" id="fb"></div>

      <p class="credit">Attēli: Pixabay (Pixabay Content License)</p>

      <div class="btnrow" id="btnrow">
        <button class="btn" id="restart">Sākt no jauna</button>
        <button class="btn main" id="next" hidden>Nākamais jautājums</button>
      </div>

      <div class="final" id="final">
        <div class="score" id="fscore"></div>
        <div class="msg" id="fmsg"></div>
        <button class="btn main" id="again">Spēlēt vēlreiz</button>
      </div>
    </div>

  </div>

</div></div>

<script>
const stage=document.getElementById('stage');
function fit(){stage.style.transform='scale('+Math.min(window.innerWidth/1600,window.innerHeight/900)+')';}
function reportHeight(){window.parent.postMessage({iframeHeight:Math.round(window.innerWidth*9/16)},'*');}
window.addEventListener('resize',()=>{fit();reportHeight();});
window.addEventListener('load',()=>{fit();reportHeight();});
fit();reportHeight();

/* ═══ spēles gaita ═══ */
let i=0,score=0,answered=false,results=[];
document.getElementById('total').textContent=Q.length;

const dotsEl=document.getElementById('dots');
function buildDots(){
  dotsEl.innerHTML='';
  Q.forEach((_,j)=>{
    const d=document.createElement('div');
    let cls='dot';
    if(results[j]===true)cls+=' ok';
    else if(results[j]===false)cls+=' no';
    else if(j===i)cls+=' now';
    d.className=cls;
    dotsEl.appendChild(d);
  });
}

const ADVICE=[
  'Nesteidzies. Vispirms izlasi visas atbildes — dažā jautājumā divas atbildes izskatās gandrīz vienādas.',
  'Ja neesi pārliecināts, atceries, ko redzēji uz paletes, kad pats jauci krāsas.',
  'Atceries krāsu riteni: centrā pamatkrāsas, tad papildkrāsas, tad starpkrāsas.',
  'Nokrāsa nav jauna krāsa. Tā ir tā pati krāsa gaišāka vai tumšāka.',
  'Vienā zemē krāsa var nozīmēt vienu, citā — pavisam ko citu. Tā ir katras tautas kultūra.'
];

function render(){
  answered=false;
  document.getElementById('fb').className='fb';
  document.getElementById('next').hidden=true;
  document.getElementById('qnum').textContent='Jautājums '+(i+1)+' no '+Q.length;
  document.getElementById('q').textContent=Q[i].q;
  document.getElementById('qhint').textContent=Q[i].hint||'';
  const im=document.getElementById('qimg');
  im.src=Q[i].img; im.alt=Q[i].alt||'';
  document.getElementById('advice').textContent=ADVICE[i%ADVICE.length];
  buildDots();
  const el=document.getElementById('opts');el.innerHTML='';
  Q[i].opts.forEach((o,k)=>{
    const b=document.createElement('button');
    b.className='opt';
    b.innerHTML=(o.c?'<span class="sw" style="background:'+o.c+'"></span>':'')+'<span>'+o.t+'</span>';
    b.addEventListener('click',()=>answer(k));
    el.appendChild(b);
  });
  updateScore();
}
function updateScore(){
  document.getElementById('score').textContent=score;
  document.getElementById('bar').style.width=(i/Q.length*100)+'%';
}
function answer(k){
  if(answered)return;
  answered=true;
  const correct=Q[i].ans;
  const btns=document.querySelectorAll('.opt');
  btns.forEach((b,j)=>{
    b.disabled=true;
    if(j===correct)b.classList.add('ok');
    else if(j===k)b.classList.add('no');
  });
  const ok=k===correct;
  if(ok)score++;
  results[i]=ok;
  buildDots();
  const fb=document.getElementById('fb');
  fb.className='fb on '+(ok?'ok':'no');
  fb.innerHTML='<b>'+(ok?'Pareizi!':'Vēl ne gluži.')+'</b> '+Q[i].fb;
  document.getElementById('next').hidden=false;
  document.getElementById('next').textContent = i===Q.length-1 ? 'Redzēt rezultātu' : 'Nākamais jautājums';
  updateScore();
}
document.getElementById('next').addEventListener('click',()=>{
  if(i===Q.length-1){finish();return;}
  i++;render();
});
function finish(){
  document.getElementById('quiz').style.display='none';
  document.getElementById('fb').className='fb';
  document.getElementById('btnrow').style.display='none';
  document.getElementById('final').classList.add('on');
  document.getElementById('fscore').textContent=score+' no '+Q.length;
  document.getElementById('bar').style.width='100%';
  let m;
  if(score===Q.length) m='Īsts krāsu detektīvs! Tu zini visu par krāsu jaukšanu un nokrāsām.';
  else if(score>=Q.length-3) m='Ļoti labi! Vēl daži āķīgi jautājumi, un lieta būs pavisam skaidra.';
  else if(score>=Q.length/2) m='Labs sākums. Pārlasi teoriju par nokrāsām un pamēģini vēlreiz.';
  else m='Šoreiz vēl bija grūti. Izmēģini krāsu jaucēju un nokrāsu kāpnes un tad atgriezies!';
  document.getElementById('fmsg').textContent=m;
}
function reset(){
  i=0;score=0;results=[];
  document.getElementById('quiz').style.display='block';
  document.getElementById('btnrow').style.display='flex';
  document.getElementById('final').classList.remove('on');
  render();
}
document.getElementById('restart').addEventListener('click',reset);
document.getElementById('again').addEventListener('click',reset);
render();
</script>
